<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTRI AI Kiosk — Admin Panel</title>
    <style>
      :root {
        --navy: #0b1f3a; --blue: #2f80ed; --blue-soft: #e8f1ff;
        --line: #d9e2ec; --bg: #f2f5fa; --muted: #627d98;
        --green: #12805c; --red: #b3261e;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Manrope, "Segoe UI", sans-serif; background: var(--bg); color: var(--navy); }
      button { font-family: inherit; cursor: pointer; }
      input, select { font-family: inherit; }

      /* ---------- login ---------- */
      .login-wrap { display: grid; place-items: center; min-height: 100vh;
        background: linear-gradient(150deg, #0b1f3a 0%, #16407c 55%, #2f80ed 130%); }
      .login-card { width: min(92vw, 400px); background: #fff; border-radius: 20px; padding: 34px 30px;
        box-shadow: 0 24px 60px rgba(4, 12, 26, 0.45); }
      .login-card h1 { margin: 0 0 4px; font-size: 22px; }
      .login-card p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }
      .field input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px;
        font-size: 15px; outline: none; }
      .field input:focus { border-color: var(--blue); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        border: 0; border-radius: 12px; padding: 13px 18px; font-size: 14px; font-weight: 800; }
      .btn-primary { width: 100%; background: linear-gradient(120deg, var(--navy), #1e4d8c); color: #fff; }
      .btn-blue { background: var(--blue); color: #fff; }
      .btn-ghost { background: #fff; border: 1.5px solid var(--line); color: var(--navy); }
      .btn-danger { background: #fdecea; color: var(--red); }
      .error { color: var(--red); font-size: 13px; font-weight: 600; margin-top: 10px; }
      .logo-dot { width: 46px; height: 46px; border-radius: 14px; margin-bottom: 16px;
        background: linear-gradient(130deg, var(--blue), var(--navy)); display: grid; place-items: center;
        color: #fff; }

      /* ---------- app shell ---------- */
      header.app { background: linear-gradient(120deg, var(--navy), #1e4d8c); color: #fff;
        padding: 16px 26px; display: flex; align-items: center; justify-content: space-between; }
      header.app .brand { display: flex; align-items: center; gap: 12px; }
      header.app .brand-mark { width: 36px; height: 36px; border-radius: 10px;
        background: rgba(255,255,255,.14); display: grid; place-items: center; }
      header.app strong { font-size: 16px; }
      header.app .who { font-size: 13px; opacity: 0.85; margin-right: 14px; display: inline-flex; align-items: center; gap: 6px; }
      header.app .btn-ghost { color: #fff; border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.08); }
      header.app .btn-ghost:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.45); }

      .ico { flex-shrink: 0; display: block; vertical-align: middle; }
      .ico-wrap { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
        background: #eef2f6; color: var(--muted); flex-shrink: 0; }
      .nav-item.active .ico-wrap, .nav-item:hover .ico-wrap { background: rgba(47,128,237,.14); color: var(--blue); }
      .nav-item.sub .ico-wrap { width: 24px; height: 24px; border-radius: 7px; }
      .nav-group-head .ico-wrap { width: 22px; height: 22px; border-radius: 6px; background: transparent; }
      .nav-group-head .grp-label { display: flex; align-items: center; gap: 8px; }
      .nav-group-head .chev { display: grid; place-items: center; opacity: .55; transition: transform 0.2s; }
      .nav-group.open .chev { transform: rotate(90deg); }

      main { display: grid; grid-template-columns: 268px 1fr; min-height: calc(100vh - 68px); }
      nav { background: #fff; border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
      nav .nav-item { width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px;
        border-radius: 10px; font-weight: 700; color: var(--navy); font-size: 13.5px; margin-bottom: 2px;
        display: flex; align-items: center; gap: 10px; }
      nav .nav-item.active, nav .nav-item:hover { background: var(--blue-soft); color: var(--blue); }
      nav .nav-group { margin-bottom: 8px; }
      nav .nav-group-head { width: 100%; text-align: left; border: 0; background: transparent;
        padding: 10px 10px 6px; font-weight: 800; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--muted); display: flex; align-items: center;
        justify-content: space-between; cursor: pointer; border-radius: 8px; }
      nav .nav-group-head:hover { background: #f8fafc; color: var(--navy); }
      nav .nav-group-items { display: none; padding-left: 4px; }
      nav .nav-group.open .nav-group-items { display: block; }
      nav .nav-item.sub { padding-left: 12px; font-size: 13px; font-weight: 600; }

      .page-head { margin-bottom: 18px; display: flex; gap: 14px; align-items: flex-start; }
      .page-head .page-ico { width: 46px; height: 46px; border-radius: 14px; background: var(--blue-soft);
        color: var(--blue); display: grid; place-items: center; flex-shrink: 0; }
      .page-head .page-copy { min-width: 0; }
      .page-head .crumb { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
      .page-head h1 { margin: 0; font-size: 22px; }
      .page-head p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 720px; }

      .dash-section h3 { display: flex; align-items: center; gap: 8px; }
      .stat { display: flex; flex-direction: column; gap: 6px; }
      .stat .stat-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--blue-soft);
        color: var(--blue); display: grid; place-items: center; }
      .stat .stat-ico.green { background: #e6f4ee; color: var(--green); }
      .stat .stat-ico.amber { background: #fff4e5; color: #b76e00; }
      .quick-links button { display: inline-flex; align-items: center; gap: 7px; }
      .bulk-bar button, .bulk-bar span.lbl { display: inline-flex; align-items: center; gap: 6px; }
      .bulk-bar span.lbl { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 4px; }
      .folder-cell { display: flex; align-items: center; gap: 10px; }
      .folder-cell .mini-ico { width: 30px; height: 30px; border-radius: 8px; background: #eef2f6;
        color: var(--blue); display: grid; place-items: center; flex-shrink: 0; }
      .thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: contain; background: #f4f7fb;
        border: 1px solid var(--line); }
      .photo-preview { width: 88px; height: 88px; border-radius: 12px; object-fit: contain; background: #f4f7fb;
        border: 1px solid var(--line); margin-top: 8px; }
      .file-hint { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

      .dash-section { margin-bottom: 22px; }
      .dash-section h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase;
        letter-spacing: 0.05em; color: var(--muted); }
      .quick-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .quick-links button { border: 1.5px solid var(--line); background: #fff; border-radius: 10px;
        padding: 10px 14px; font-size: 12.5px; font-weight: 700; color: var(--navy); }
      .quick-links button:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }

      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
      .toolbar select { padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px;
        font-size: 13px; font-weight: 600; min-width: 180px; background: #fff; }

      section.content { padding: 22px 26px; }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
      .card h2 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
      .card .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

      .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
      .stat .n { font-size: 28px; font-weight: 800; }
      .stat .l { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; }

      table { width: 100%; border-collapse: collapse; }
      table.wrap { display: block; overflow-x: auto; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
      th { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
      .muted { color: var(--muted); }
      .pill { display: inline-block; border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 800; }
      .pill.on { background: #e6f4ee; color: var(--green); }
      .pill.off { background: #fdecea; color: var(--red); }
      .detail-row { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .email-tag { display: inline-block; background: var(--blue-soft); color: var(--blue); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; margin: 2px 2px 0 0; }

      .act-row { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
      .act-btn { padding: 5px 9px; font-size: 11px; font-weight: 800; border-radius: 8px;
        border: 1.5px solid var(--line); background: #fff; color: var(--navy); white-space: nowrap;
        display: inline-flex; align-items: center; gap: 5px; }
      .act-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
      .act-btn.edit { color: var(--blue); }
      .act-btn.del { color: var(--red); border-color: #f5c6c2; background: #fff5f4; }
      .act-btn.del:hover { background: #fdecea; }
      .bulk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px;
        padding: 10px 12px; background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; }
      .bulk-bar span { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 4px; }
      .bulk-bar button { padding: 7px 12px; font-size: 11.5px; font-weight: 800; border-radius: 8px;
        border: 1.5px solid var(--line); background: #fff; color: var(--navy);
        display: inline-flex; align-items: center; gap: 6px; }
      .bulk-bar button:hover { border-color: var(--blue); color: var(--blue); }
      .detail-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; font-size: 13px; }
      .detail-grid dt { color: var(--muted); font-weight: 700; margin: 0; }
      .detail-grid dd { margin: 0; word-break: break-word; }
      .swatch-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .swatch { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(11,31,58,.12);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); flex-shrink: 0; }
      .swatch-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px;
        border: 1px solid var(--line); border-radius: 999px; font-size: 11px; font-weight: 700;
        background: #fff; margin: 0 6px 6px 0; }
      .swatch-chip .swatch { width: 18px; height: 18px; border-radius: 999px; }
      .palette-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
      th.act-col, td.act-col { text-align: right; min-width: 140px; }

      /* palette editor */
      .pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
      .pal-item { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
      .pal-item .sw { height: 72px; }
      .pal-item .meta { padding: 10px 12px; }
      .pal-item .meta strong { display: block; font-size: 13px; }
      .pal-item .meta span { font-size: 11.5px; color: var(--muted); }
      .pal-item .actions { display: flex; gap: 6px; padding: 0 12px 12px; }
      .pal-item .actions button { flex: 1; padding: 7px 0; font-size: 11.5px; font-weight: 800;
        border-radius: 8px; border: 1.5px solid var(--line); background: #fff;
        display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
      .pal-item .actions .edit { color: var(--blue); }
      .pal-item .actions .del { color: var(--red); }

      .add-row { display: grid; grid-template-columns: 1fr minmax(220px, 280px) 100px auto; gap: 10px; align-items: end; }
      .add-row .field { margin: 0; }
      .field-hint { font-size: 11px; color: var(--muted); margin: 0 0 6px; font-weight: 600; line-height: 1.35; }
      .color-input-row { display: flex; gap: 8px; align-items: center; }
      .color-input-row input[type="color"] { width: 52px; height: 46px; padding: 4px; border: 1.5px solid var(--line);
        border-radius: 12px; background: #fff; flex-shrink: 0; cursor: pointer; }
      .color-input-row input[type="text"] { flex: 1; min-width: 0; padding: 11px 12px; border: 1.5px solid var(--line);
        border-radius: 12px; font-size: 14px; font-weight: 700; font-family: ui-monospace, monospace; }
      .color-input-row input[type="text"]:focus { border-color: var(--blue); outline: none; }

      dialog { border: 0; border-radius: 18px; padding: 24px; width: min(92vw, 380px);
        box-shadow: 0 30px 70px rgba(4, 12, 26, 0.4); }
      dialog::backdrop { background: rgba(8, 18, 36, 0.55); }
      .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: var(--navy); color: #fff; border-radius: 12px; padding: 12px 20px; font-size: 14px;
        font-weight: 700; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 60; }
      .toast.show { opacity: 1; }
      @media (max-width: 860px) {
        main { grid-template-columns: 1fr; }
        nav { display: block; max-height: none; }
        nav .nav-group-items { display: block !important; }
        nav .nav-group-head .chev { display: none; }
        .stat-grid { grid-template-columns: repeat(2, 1fr); }
        .add-row { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast"></div>

    <script>
      // API served by the same Apache — works on localhost and on the kiosk LAN
      const API = new URL('../backend/public/api', window.location.href).href;
      const app = document.getElementById('app');
      let token = localStorage.getItem('ptri_admin_token') || '';
      let adminName = localStorage.getItem('ptri_admin_name') || 'Admin';
      let currentView = 'dashboard';

      function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2400);
      }

      function esc(s) {
        return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function parseColorsJson(raw) {
        if (!raw) return [];
        if (Array.isArray(raw)) return raw;
        try {
          const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function renderColorSwatches(colors, max = 6) {
        if (!colors.length) return '<span class="muted">—</span>';
        const shown = colors.slice(0, max);
        const chips = shown.map((c) => {
          const hex = c.hex || '#cbd5e1';
          const name = c.name || hex;
          return `<span class="swatch" title="${esc(name)}" style="background:${esc(hex)}"></span>`;
        }).join('');
        const extra = colors.length > max
          ? `<span class="muted" style="font-size:11px;font-weight:700">+${colors.length - max}</span>`
          : '';
        return `<div class="swatch-row">${chips}${extra}</div>`;
      }

      function renderColorChips(colors) {
        if (!colors.length) return '<span class="muted">No colors saved for this session.</span>';
        return colors.map((c) => {
          const hex = c.hex || '#cbd5e1';
          const name = c.name || 'Color';
          return `<span class="swatch-chip"><span class="swatch" style="background:${esc(hex)}"></span>${esc(name)} <span class="muted">${esc(hex)}</span></span>`;
        }).join('');
      }

      function formatColorsCsv(colors) {
        return colors.map((c) => `${c.name || 'Color'} (${c.hex || '?'})`).join('; ') || '';
      }

      function selectionModeLabel(mode) {
        if (mode === 'top5') return 'Top 5 (AI picks)';
        if (mode === 'top10') return 'Top 10 (AI picks)';
        if (mode === 'custom') return 'Custom selection';
        return mode || '—';
      }

      function normalizeHex(value) {
        let hex = String(value || '').trim();
        if (!hex) return null;
        if (!hex.startsWith('#')) hex = '#' + hex;
        if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return null;
        return hex.toUpperCase();
      }

      function bindHexPair(pickerId, textId) {
        const picker = document.getElementById(pickerId);
        const text = document.getElementById(textId);
        if (!picker || !text) return;
        picker.addEventListener('input', () => {
          text.value = picker.value.toUpperCase();
        });
        text.addEventListener('input', () => {
          const normalized = normalizeHex(text.value);
          if (normalized) picker.value = normalized;
        });
        text.addEventListener('blur', () => {
          const normalized = normalizeHex(text.value);
          if (normalized) {
            text.value = normalized;
            picker.value = normalized;
          }
        });
      }

      function readHexPair(pickerId, textId) {
        const text = document.getElementById(textId);
        const picker = document.getElementById(pickerId);
        const normalized = normalizeHex(text?.value || picker?.value);
        if (!normalized) throw new Error('Enter a valid hex color like #CC8899');
        return normalized;
      }

      const ICONS = {
        dashboard: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="4" rx="1"/><rect x="14" y="10" width="7" height="11" rx="1"/><rect x="3" y="13" width="7" height="8" rx="1"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
        folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
        'folder-open': '<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
        palette: '<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
        layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
        shirt: '<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>',
        activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
        check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
        bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
        spark: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>',
        pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
        trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
        eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
        'eye-off': '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>',
        copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',

        const body = ICONS[name];

        return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;

        return `<span class="ico-wrap">${icon(name, size)}</span>`;

      function actBtn(label, cls, attrs = '', iconName = null) {

      async function bulkToggle(endpoint, items, active, onDone) {
        const label = active ? 'show' : 'hide';
        if (!confirm(`${active ? 'Show' : 'Hide'} all ${items.length} items?`)) return;
        try {
          await Promise.all(items.map((item) =>
            call(`${endpoint}/${item.id}`, { method: 'PUT', body: JSON.stringify({ is_active: active }) })));
          toast(`All items ${label === 'show' ? 'shown' : 'hidden'}.`);
          onDone();

        document.body.appendChild(dlg);
        dlg.showModal();
        dlg.querySelector('#detail-close').addEventListener('click', () => dlg.close());
        dlg.addEventListener('close', () => dlg.remove());

      async function call(path, options = {}) {
        const res = await fetch(API + path, {
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json',
            ...(token ? { Authorization: 'Bearer ' + token } : {}),
          },
          ...options,
        });
        const payload = await res.json().catch(() => ({}));
        if (res.status === 401) { logout(); throw new Error('Session expired — please sign in.'); }
        if (!res.ok || payload.ok === false) {
          throw new Error(payload?.error?.message || 'Request failed (' + res.status + ')');
        }
        return payload.data;
      }

      async function callForm(path, formData, method = 'POST') {
        const res = await fetch(API + path, {
          method,
          headers: {
            Accept: 'application/json',
            ...(token ? { Authorization: 'Bearer ' + token } : {}),
          },
          body: formData,
        });
        const payload = await res.json().catch(() => ({}));
        if (res.status === 401) { logout(); throw new Error('Session expired — please sign in.'); }
        if (!res.ok || payload.ok === false) {
          throw new Error(payload?.error?.message || 'Request failed (' + res.status + ')');
        }
        return payload.data;
      }

        document.getElementById('add-design-form').addEventListener('submit', async (e) => {

          if (!preview) { toast('Please choose a catalog photo.'); return; }
          try {

            fd.append('category_id', document.getElementById('des-cat').value);

                  <td class="muted">${esc(e.age_range || '—')}</td>
                  <td class="muted">${esc(e.gender || '—')}</td>
                  <td><span class="pill ${e.status === 'sent' ? 'on' : 'off'}">${esc(e.status)}</span></td>
                  <td class="muted">${e.sent_at ? new Date(e.sent_at).toLocaleString() : '—'}</td>
                  <td class="muted">${new Date(e.created_at).toLocaleString()}</td>
                  <td class="act-col">
                    <div class="act-row">
                      ${actBtn('View', 'em-view', `data-id="${e.id}"`, 'eye')}
                      ${actBtn('Copy email', 'em-copy', `data-email="${esc(e.email)}"`, 'copy')}
                    </div>
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>
            ${rows.length === 0 ? '<p class="muted" style="margin-top:14px">No emails queued yet.</p>' : ''}
          </div>`;

        view.querySelectorAll('.em-view').forEach((b) => b.addEventListener('click', () => {
          const e = rows.find((x) => String(x.id) === b.dataset.id);
          if (!e) return;
          showDetailDialog(e.email, [
            ['Email', esc(e.email)],
            ['Visitor', esc(e.full_name || 'Guest')],
            ['Age range', esc(e.age_range || '—')],
            ['Gender', esc(e.gender || '—')],
            ['Status', esc(e.status)],
            ['Session ID', esc(e.session_id || '—')],
            ['Sent at', e.sent_at ? new Date(e.sent_at).toLocaleString() : '—'],
            ['Queued at', new Date(e.created_at).toLocaleString()],
          ]);
        }));
        view.querySelectorAll('.em-copy').forEach((b) => b.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(b.dataset.email);
            toast('Email copied.');
          } catch { toast('Could not copy.'); }
        }));
        document.getElementById('em-export')?.addEventListener('click', () => {
          const headers = ['Email', 'Visitor', 'Age', 'Gender', 'Status', 'Sent', 'Queued'];
          const csvRows = rows.map((e) => [
            e.email, e.full_name || 'Guest', e.age_range || '', e.gender || '', e.status,
            e.sent_at ? new Date(e.sent_at).toISOString() : '',
            new Date(e.created_at).toISOString(),
          ]);
          const csv = [headers, ...csvRows].map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
          a.download = 'email-log.csv';
          a.click();
          toast('CSV exported.');
        });
      }

      /* ---------------- boot ---------------- */
      if (token) {
        renderShell();
        show('dashboard');
      } else {
        renderLogin();
      }
    </script>
  </body>
</html>
